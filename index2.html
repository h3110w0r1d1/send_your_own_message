<html>
<body>
  <button type="button" onclick="a(event)">Send Message</button><br>
  <b>Message(optional):</b> <input type="text" id="messIn" placeholder="example text"><br><br>

  <input type="checkbox" id="masterToggle"> 
  <label for="masterToggle"><b>Enable Embeds</b></label>
<details><summary>Embeds(optional)</summary>
  <div id="embedContainer">
    <details><summary>Embed 1</summary>

    <details><summary>Embed 2</summary>

      <b>Desc:</b> <input type="text" class="em-desc">
      <input type="color" class="em-color" value="#000000">
    </details>
    <details><summary>Embed 3</summary>
      <b>Title:</b> <input type="text" class="em-title">
      <b>Desc:</b> <input type="text" class="em-desc">
      <input type="color" class="em-color" value="#000000">
    </details>
    <details><summary>Embed 4</summary>
      <b>Title:</b> <input type="text" class="em-title">
      <b>Desc:</b> <input type="text" class="em-desc">
      <input type="color" class="em-color" value="#000000">
    </details>
    <details><summary>Embed 5</summary>
      <b>Title:</b> <input type="text" class="em-title">
      <b>Desc:</b> <input type="text" class="em-desc">

    </details>
    <details><summary>Embed 6</summary>

    </details>
    <details><summary>Embed 7</summary>

    </details>
    <details><summary>Embed 8</summary>

    </details>
    <details><summary>Embed 9</summary>

    </details>
    <details><summary>Embed 10</summary>
      <b>Title:</b> <input type="text" class="em-title">
      <b>Desc:</b> <input type="text" class="em-desc">
      <input type="color" class="em-color" value="#000000">
    </details>
  </div>
</details>
  <script>
    async function a(event) {
      if (event) event.preventDefault();
      let params = new URLSearchParams();
      params.append("m", document.getElementById("messIn").value);
      const masterEnabled = document.getElementById("masterToggle").checked;
      const sections = document.querySelectorAll('#embedContainer details');
      let addedAny = false;
      if (masterEnabled) {
        sections.forEach(section => {
          let title = section.querySelector('.em-title').value.trim();
          if (title !== "") {
            addedAny = true;
            params.append("emt", title);
            params.append("emd", section.querySelector('.em-desc').value);
            params.append("emc", section.querySelector('.em-color').value);
          }
        });
      }

      if (addedAny) params.append("em", "true");

      try {
        const response = await fetch("https://example.com?" + params.toString(), { 
          method: "POST" 
        });
        
        if (response.ok) {
         console.log("sent");
        }
      } catch (err) {
        console.error("Fetch error:", err);
      }
    }
  </script>
</body>
</html>
